name: Deploy TIPER Website

on:
  push:
    branches: [ prod ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: prod)'
        required: false
        default: 'prod'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Production Server
      env:
        DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        envs: DEPLOY_BRANCH
        script: |
          set -e
          echo "🚀 Starting deployment for TIPER Website..."
          echo "📌 Deploying branch: ${DEPLOY_BRANCH}"
          
          cd /var/www/html/translam-tiper-website || exit 1
          
          git remote set-url origin git@github.com:kirtimanga/translam-tiper-website.git
          echo "📦 Pulling latest code from origin/${DEPLOY_BRANCH}..."
          git fetch origin
          git checkout ${DEPLOY_BRANCH} 2>/dev/null || git checkout -b ${DEPLOY_BRANCH} origin/${DEPLOY_BRANCH}
          git reset --hard origin/${DEPLOY_BRANCH}
          
          echo "📦 Installing backend dependencies..."
          cd admin-backend
          npm install --production
          cd ..
          
          echo "📦 Installing frontend dependencies..."
          npm install
          
          echo "🔨 Building frontend..."
          npm run build
          
          echo "🔄 Restarting PM2 processes..."
          pm2 restart tiper-backend --update-env
          pm2 restart tiper-frontend --update-env
          
          echo "✅ TIPER Website deployment completed successfully!"
          pm2 list | grep tiper

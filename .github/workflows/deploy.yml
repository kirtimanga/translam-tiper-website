name: Deploy TIPER Website

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Production Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Starting deployment for TIPER Website..."
          
          # Navigate to project directory
          cd /var/www/html/translam-tiper-website || exit 1
          
          # Pull latest changes
          echo "📦 Pulling latest code..."
          git fetch origin
          git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          
          # Install backend dependencies
          echo "📦 Installing backend dependencies..."
          cd admin-backend
          npm install --production
          cd ..
          
          # Install frontend dependencies and build
          echo "📦 Installing frontend dependencies..."
          npm install
          
          echo "🔨 Building frontend..."
          npm run build
          
          # Restart PM2 processes
          echo "🔄 Restarting PM2 processes..."
          pm2 restart tiper-backend --update-env
          pm2 restart tiper-frontend --update-env
          
          echo "✅ TIPER Website deployment completed successfully!"
          pm2 list | grep tiper
